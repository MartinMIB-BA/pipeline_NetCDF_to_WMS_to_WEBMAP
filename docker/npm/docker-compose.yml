# ─────────────────────────────────────────────────────────────────────────────
# Nginx Proxy Manager (NPM) — edge reverse proxy + Let's Encrypt SSL
#
# Sits IN FRONT of the existing `web` nginx container. NPM owns host ports
# 80/443 and terminates HTTPS; it proxies metron.duckdns.org onward to the
# `web` container over the shared `edge` docker network. The `web` container
# keeps its tuned GWC tile-cache config untouched — it just stops publishing
# 80/443 on the host (NPM takes them) and joins the `edge` network.
#
# SSL: Let's Encrypt via DNS-01 challenge using the DuckDNS provider. The
# DuckDNS token is entered by hand in the NPM GUI (SSL Certificates screen,
# field `dns_duckdns_token=...`). It is NEVER stored in this repo.
#
# Admin GUI: http://<server>:81  (default login admin@example.com / changeme —
# change it on first login).
#
# Persistent state lives under /opt/geoserver/npm on the server, consistent
# with the rest of the stack keeping state under /opt/geoserver.
# ─────────────────────────────────────────────────────────────────────────────
services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"     # HTTP  (edge) — also used for ACME HTTP-01 fallback / redirects
      - "443:443"   # HTTPS (edge) — TLS terminated here
      # Admin GUI bound to loopback ONLY — not exposed to the internet. Docker
      # publishes ports via its own iptables DNAT rules that bypass ufw, so a
      # ufw "allow from <ip>" on 81 does NOT actually restrict it. Binding to
      # 127.0.0.1 is the reliable, declarative fix. Reach the GUI via SSH tunnel:
      #   ssh -L 8181:localhost:81 ubuntu@89.47.190.54   →  http://localhost:8181
      - "127.0.0.1:81:81"  # NPM admin GUI (loopback only; use SSH tunnel)
    volumes:
      - /opt/geoserver/npm/data:/data
      - /opt/geoserver/npm/letsencrypt:/etc/letsencrypt
    networks:
      - edge

# The `edge` network is shared with the main stack's `web` container so NPM can
# reach it by name (proxy target: web:80). It is created out-of-band on the
# server (docker network create edge) and referenced here as external so both
# compose projects can attach to the same network.
networks:
  edge:
    external: true
