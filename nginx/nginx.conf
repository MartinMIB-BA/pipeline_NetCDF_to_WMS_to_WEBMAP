worker_processes auto;  # využije všetkých 16 jadier

events {
    worker_connections 4096;  # spojení na jeden worker proces
    multi_accept on;          # každý worker prijme naraz viac spojení
}

http {
    log_format gs '$time_iso8601 $remote_addr "$request" '
                  'status=$status rt=$request_time urt=$upstream_response_time cache=$upstream_cache_status';

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # ─── Compression ─────────────────────────────────────────────────────
    # JS/CSS/HTML/JSON/XML were sent uncompressed (~960 KB on first load of
    # the Vite build, ~250 KB gzipped). PNG tiles are already compressed and
    # are deliberately NOT listed. gzip_proxied any: production traffic arrives
    # via nginx-proxy-manager, so requests may carry a Via header; without
    # this nginx would skip compression for them. Upstream responses that are
    # already Content-Encoded (e.g. GeoServer GetCapabilities) are left as is.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types
        text/css
        text/plain
        text/xml
        application/javascript
        text/javascript
        application/json
        application/geo+json
        application/xml
        application/vnd.ogc.wms_xml
        application/vnd.ogc.se_xml
        image/svg+xml
        font/ttf
        application/vnd.ms-fontobject;

    include /etc/nginx/conf.d/*.conf;
}