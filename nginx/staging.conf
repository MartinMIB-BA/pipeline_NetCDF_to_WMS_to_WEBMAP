server {
    listen 8082;
    server_name _;
    access_log /var/log/nginx/access.log gs;

    # Serve the Vite build output. host /opt/geoserver/web_dev/web is mounted
    # at /usr/share/nginx/html_dev, so .../dist resolves to the on-server build
    # artifact /opt/geoserver/web_dev/web/dist produced by deploy-staging.sh.
    root /usr/share/nginx/html_dev/dist;
    # Vite emits dist/index.vite.html (there is no dist/index.html); point the
    # entry + SPA fallback at it directly rather than renaming after each build.
    index index.vite.html;

    # HTML must always revalidate so a new deploy's hashed asset bundle
    # (assets/index.vite-<hash>.js) is picked up immediately. A stale cached
    # index keeps referencing the OLD hashed bundle. The hashed JS/CSS under
    # dist/assets/ stay long-cached because their URL changes each release.
    location / {
        try_files $uri $uri/ /index.vite.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    # GWC tiles — proxy to same GeoServer backend with cache
    location /geoserver/gwc/ {
        proxy_pass http://geoserver_backend/geoserver/gwc/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache gwc_cache;
        proxy_cache_valid 200 206 7d;
        proxy_cache_key $gwc_tile_key;   # same semantic key as production — staging shares warmed tiles
        proxy_ignore_headers Cache-Control Expires;
        # Browser cache layer — same as production. Without this, GWC's raw
        # "no-cache, no-store" passes through and browsers refetch every tile.
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=3600";
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Access-Control-Allow-Origin "*" always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GeoServer WMS/admin — no cache
    location /geoserver/ {
        proxy_pass http://geoserver_backend/geoserver/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type" always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
