# Host-side logrotate rule for the `web` nginx container logs.
# Install: sudo install -m 644 -o root -g root nginx/logrotate-nginx.conf /etc/logrotate.d/coastal-wms-nginx
#
# The container writes /var/log/nginx/*.log, bind-mounted from
# /opt/geoserver/monitoring/nginx_logs (also read by promtail → Loki).
# Before this rule access.log grew unbounded (21.8 GB on 2026-11-19).
#
# Rotation renames the file, then USR1 makes nginx reopen its log files, so no
# lines are lost (unlike copytruncate). Promtail follows the rename by itself.
/opt/geoserver/monitoring/nginx_logs/*.log {
    su root root
    daily
    maxsize 1G
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts
    postrotate
        docker kill --signal=USR1 web >/dev/null 2>&1 || true
    endscript
}
